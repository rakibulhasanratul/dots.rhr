# Fonts & Styling
font_family         family="JetBrainsMono Nerd Font" style="Light"
bold_font           family="JetBrainsMono Nerd Font" style="Bold"
italic_font         family="JetBrainsMono Nerd Font" style="Light Italic"
bold_italic_font    family="JetBrainsMono Nerd Font" style="Bold Italic"

font_size        12.0

# Ligatures (Arrows Rendering)
disable_ligatures never

# Window
remember_window_size   yes
initial_window_width   100c
initial_window_height  35c
window_padding_width   1
hide_window_decorations yes
confirm_os_window_close 0

# Bell
enable_audio_bell yes

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select        clipboard
mouse_hide_wait       3.0
url_style             curly

# Tab bar
tab_bar_edge          bottom

# Carbonfox Theme (Nightfox)
# https://github.com/EdenEast/nightfox.nvim

# The basic colors
foreground #f2f4f8
background #161616

# Cursor colors
cursor           #f2f4f8
cursor_text_color #161616

# URL color when hovering with mouse
url_color #25be6a

# Selection colors
selection_foreground #161616
selection_background #2a2a2a

# Kitty window border colors
active_border_color   #78a9ff
inactive_border_color #3ddbd9
bell_border_color     #ff7eb6

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #161616
active_tab_background   #78a9ff
inactive_tab_foreground #f2f4f8
inactive_tab_background #242424
tab_bar_background      #111111

# Colors for marks
mark1_foreground #161616
mark1_background #78a9ff
mark2_foreground #161616
mark2_background #be95ff
mark3_foreground #161616
mark3_background #33b1ff

# The 16 terminal colors

# black
color0 #282828
color8 #484848

# red
color1 #ee5396
color9 #f16da6

# green
color2 #25be6a
color10 #46c880

# yellow
color3 #08bdba
color11 #2dc7c4

# blue
color4 #78a9ff
color12 #8cb6ff

# magenta
color5 #be95ff
color13 #c8a5ff

# cyan
color6 #33b1ff
color14 #52bdff

# white
color7 #dfdfe0
color15 #e4e4e5

# extended colors
color16 #3ddbd9
color17 #ff7eb6

# Key mappings - F11 to toggle fullscreen
map f11 toggle_fullscreen


# BEGIN_KITTY_FONTS
# END_KITTY_FONTS
