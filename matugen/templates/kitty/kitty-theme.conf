# Matugen dynamic color template for Kitty terminal

# Basic colors
foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface.default.hex}}

# Cursor
cursor                {{colors.on_surface.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}

# Selection colors
selection_foreground  {{colors.on_secondary.default.hex}}
selection_background  {{colors.secondary_container.default.hex}}

# URL color
url_color             {{colors.primary.default.hex}}

# Window borders
active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.surface_container.default.hex}}
bell_border_color     {{colors.error.default.hex}}

# Tab bar colors
active_tab_foreground   {{colors.on_primary.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_container_low.default.hex}}
tab_bar_background      {{colors.surface_container_lowest.default.hex}}

# Normal 8 colors (ANSI)
color0  {{colors.surface_container_lowest.default.hex}}
color1  {{colors.error.default.hex}}
color2  {{colors.tertiary.default.hex}}
color3  {{colors.primary.default.hex}}
color4  {{colors.secondary.default.hex}}
color5  {{colors.tertiary_container.default.hex}}
color6  {{colors.primary_container.default.hex}}
color7  {{colors.on_surface.default.hex}}

# Bright 8 colors
color8  {{colors.outline.default.hex}}
color9  {{colors.error.default.hex}}
color10 {{colors.tertiary.default.hex}}
color11 {{colors.primary.default.hex}}
color12 {{colors.secondary.default.hex}}
color13 {{colors.tertiary_container.default.hex}}
color14 {{colors.primary_container.default.hex}}
color15 {{colors.on_surface_variant.default.hex}}
